
name: OpenLara Web Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Diagnose source files
        run: |
          echo "Repository root:"
          pwd
          echo "Checking required files..."
          for f in platform/web/main.cpp platform/web/level/1/TITLE.PSX libs/stb_vorbis/stb_vorbis.c libs/tinf/tinflate.c; do
            if test -f "$f"; then
              echo "FOUND: $f"
            else
              echo "MISSING: $f"
            fi
          done
          echo "Web directory:"
          ls -la platform/web
